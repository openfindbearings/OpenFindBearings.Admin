name: build

on:
  # 改动说明（2026-10-25 省 Actions 额度）：去掉 push 触发，只在 PR 上构建（PR 检查已覆盖合并结果），
  #   避免 dev→main 的 PR 与合并后各跑一遍；保留手动触发
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal || true
