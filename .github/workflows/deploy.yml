name: publish-deploy

permissions:
  contents: read
  packages: write

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g., v1.2.3, staging, dev-20260104)'
        required: true
        default: 'latest'
      reason:
        description: 'Reason for manual publish'
        required: false
      skip_deploy:
        description: 'Skip K3s deploy (build and push only)'
        type: boolean
        required: false
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.set_tag.outputs.docker_tag }}
      image_name: ${{ steps.set_image_name.outputs.image_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Determine Docker tag
        id: set_tag
        run: |
          case "${{ github.event_name }}" in
            release)
              TAG="${{ github.event.release.tag_name }}"
              ;;
            workflow_dispatch)
              TAG="${{ github.event.inputs.tag }}"
              ;;
            *)
              TAG="latest"
              ;;
          esac
          echo "docker_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Determine Image Name
        id: set_image_name
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          TEMP_NAME=$(echo "$REPO_NAME" | tr '.' '-')
          IMAGE_NAME=$(echo "$TEMP_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Image: $IMAGE_NAME"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: src/OpenFindBearings.Admin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.set_image_name.outputs.image_name }}:${{ steps.set_tag.outputs.docker_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.set_image_name.outputs.image_name }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' && !inputs.skip_deploy)

    steps:
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_CONTENT" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to K3s
        env:
          NAMESPACE: "openfindbearings"
          DEPLOYMENT: "openfindbearings-admin"
          CONTAINER: "openfindbearings-admin"
          IMAGE: "ghcr.io/${{ github.repository_owner }}/${{ needs.build-and-push.outputs.image_name }}:${{ needs.build-and-push.outputs.docker_tag }}"
        run: |
          set -e

          echo "========================================="
          echo "开始部署到 K3s"
          echo "部署时间: $(date)"
          echo "========================================="
          echo "命名空间: $NAMESPACE"
          echo "Deployment: $DEPLOYMENT"
          echo "容器名称: $CONTAINER"
          echo "镜像地址: $IMAGE"
          echo "========================================="

          if ! kubectl get namespace $NAMESPACE &> /dev/null; then
            echo "错误: 命名空间 $NAMESPACE 不存在"
            exit 1
          fi

          if ! kubectl get deployment $DEPLOYMENT -n $NAMESPACE &> /dev/null; then
            echo "错误: deployment $DEPLOYMENT 在命名空间 $NAMESPACE 中不存在"
            kubectl get deployments -n $NAMESPACE
            exit 1
          fi

          CURRENT_IMAGE=$(kubectl get deployment $DEPLOYMENT \
            -n $NAMESPACE \
            -o jsonpath="{.spec.template.spec.containers[?(@.name==\"$CONTAINER\")].image}")

          echo "当前镜像: $CURRENT_IMAGE"
          echo "新镜像: $IMAGE"

          echo "正在更新 deployment 镜像..."
          kubectl set image deployment/$DEPLOYMENT \
            $CONTAINER=$IMAGE \
            -n $NAMESPACE \
            --record

          echo "等待 rollout 完成（超时时间: 10分钟）..."
          if ! kubectl rollout status deployment/$DEPLOYMENT \
            -n $NAMESPACE \
            --timeout=10m; then
            echo ""
            echo "部署失败，正在回滚..."
            kubectl rollout undo deployment/$DEPLOYMENT \
              -n $NAMESPACE
            echo "回滚完成"
            kubectl get deployment $DEPLOYMENT \
              -n $NAMESPACE \
              -o jsonpath="{.spec.template.spec.containers[?(@.name==\"$CONTAINER\")].image}"
            echo ""
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "部署成功"
          echo "========================================="
          kubectl get deployment $DEPLOYMENT -n $NAMESPACE
          echo ""
          kubectl get pods -n $NAMESPACE -l app=openfindbearings-admin
          echo ""
          echo "部署完成时间: $(date)"

  # 镜像保留策略（open-core 基建，2026-09-29）：发布成功后仅保留最近 5 个镜像版本
  # （滚动在用的 latest/当前 tag 天然在列），防 GHCR 存储无界累积；权限复用仓库自带
  # GITHUB_TOKEN 的 packages:write 无需新 secret；单架构构建（未声明 platform），
  # 一次推送=一个版本条目，不涉及多架构子 manifest 误删问题
  cleanup-old-images:
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: 清理 GHCR 旧镜像版本（tag 版本留最新 5 个 + 无标签缓存留最新 10 个）
        # 改动说明（2026-09-29）：弃用 delete-package-versions action——其"保留最新N"按时间戳
        # 把 untagged 缓存版本混入计数抢名额，且从最老删起遇 403（旧仓库时期推送的遗留版本）即
        # 整体中止，实测导致清理完全失效。改为 gh api 逐个删除：tag 与 untagged 分开计数保留，
        # 单个 403 仅跳过告警不中断，整步容错不阻塞发布
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKGS: "${{ needs.build-and-push.outputs.image_name }}"
        run: |
          for pkg in $PKGS; do
            echo "== 清理容器包: $pkg =="
            gh api "/users/${{ github.repository_owner }}/packages/container/$pkg/versions?per_page=100" --paginate > versions.json || { echo "获取版本列表失败，跳过 $pkg"; continue; }
            # 保留规则：tag 版本按时间倒序留最新 5 个；untagged 缓存版本留最新 2 个（上一次构建的缓存供下次复用）；其余删除
            jq -r '
              def keep(n): sort_by(.created_at) | reverse | to_entries
                | map(select(.key >= n) | .value.id);
              (map(select((.metadata.container.tags // []) | length > 0)) | keep(5)) +
              (map(select((.metadata.container.tags // []) | length == 0)) | keep(2))
              | .[]' versions.json > delete_ids.txt
            total=$(wc -l < delete_ids.txt)
            echo "待删除版本数: $total"
            while read -r id; do
              gh api -X DELETE "/users/${{ github.repository_owner }}/packages/container/$pkg/versions/$id" 2>/dev/null \
                || echo "跳过 $id（本仓库 token 无权限的历史版本，可在 org Packages 网页端手动清）"
            done < delete_ids.txt
          done
