apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfindbearings-admin
  namespace: openfindbearings
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: openfindbearings-admin
  template:
    metadata:
      labels:
        app: openfindbearings-admin
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      # 改动说明（本次）：dpkeys 供 Data Protection 密钥持久化。hostPath 由 kubelet 以 root:0755
      #   DirectoryOrCreate 建出，而容器以非 root（uid 1654，基础镜像 APP_UID）运行，
      #   直接写会 UnauthorizedAccessException；用 root 身份的 initContainer 每次调度纠正属主。
      initContainers:
      - name: dpkeys-init
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "chown -R 1654:1654 /app/dpkeys && chmod 700 /app/dpkeys"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: dpkeys
          mountPath: /app/dpkeys
      containers:
      - name: openfindbearings-admin
        image: ghcr.io/openfindbearings/openfindbearings-admin:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        # 改动说明（v2.19.0）：Admin 已无本地数据库（无 DbContext、无迁移），不再注入连接串；
        #   原 ConnectionStrings__DefaultConnection 指向已废弃的 db_admin，已移除
        - name: ApiUrls__OpenFindBearingsApi
          value: "http://openfindbearings-api:80"
        - name: ApiUrls__OpenFindBearingsIdentity
          value: "http://openfindbearings-identity:80"
        - name: Identity__Authority
          value: "https://<your-identity-domain>"
        - name: Identity__CallbackUrl
          value: "https://<your-admin-domain>/callback"
        - name: Identity__ClientSecret
          valueFrom:
            secretKeyRef:
              name: openfindbearings-admin-secrets
              key: Identity__ClientSecret
        # 改动说明（本次）：Data Protection 密钥持久化目录，避免 Pod 重启后管理员 cookie 全部失效被踢下线
        - name: DataProtection__KeysPath
          value: "/app/dpkeys"
        volumeMounts:
        - name: dpkeys
          mountPath: /app/dpkeys
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      # 改动说明（本次）：Data Protection 密钥持久卷（hostPath，单副本；DirectoryOrCreate 自动建目录）
      volumes:
      - name: dpkeys
        hostPath:
          path: <your-data-dir>/admin/dpkeys
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: openfindbearings-admin
  namespace: openfindbearings
spec:
  selector:
    app: openfindbearings-admin
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
