apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfindbearings-admin
  namespace: openfindbearings
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: openfindbearings-admin
  template:
    metadata:
      labels:
        app: openfindbearings-admin
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: openfindbearings-admin
        image: ghcr.io/openfindbearings/openfindbearings-admin:v1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: openfindbearings-admin-secrets
              key: connection-string
        - name: ApiUrls__OpenFindBearingsApi
          value: "http://openfindbearings-api:80"
        - name: ApiUrls__FindBearingsSync
          value: "http://openfindbearings-sync-api:80"
        - name: ApiUrls__OpenFindBearingsIdentity
          value: "http://openfindbearings-identity:80"
        - name: Identity__Authority
          value: "https://auth.abcsxl.com"
        - name: Identity__CallbackUrl
          value: "https://admin.515813.xyz/callback"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: openfindbearings-admin
  namespace: openfindbearings
spec:
  selector:
    app: openfindbearings-admin
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
