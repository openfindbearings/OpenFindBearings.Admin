apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfindbearings-admin-ingress
  namespace: openfindbearings
  labels:
    name: openfindbearings-admin-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # 登录 callback 成功时写入的多段 chunked auth cookie 响应头总大小超过 nginx 默认缓冲，
    # 导致 "upstream sent too big header" → 502。调大 proxy-buffer-size 以兼容大 Set-Cookie 响应头。
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - admin.515813.xyz
    secretName: admin-515813-xyz-tls

  rules:
  - host: "admin.515813.xyz"
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: openfindbearings-admin
              port:
                number: 80